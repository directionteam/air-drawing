<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Air Drawing - ارسم في الهواء</title>
<style>
  body { margin: 0; overflow: hidden; font-family: sans-serif; background: #111; }
  canvas { position: absolute; top: 0; left: 0; }
  #video { display: none; }
  #ui {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 12px; background: rgba(0,0,0,0.6);
    padding: 12px 20px; border-radius: 40px; z-index: 10;
    align-items: center; flex-wrap: wrap; justify-content: center;
  }
  .color-btn { width: 32px; height: 32px; border-radius: 50%; border: 2px solid #fff; cursor: pointer; }
  .color-btn.active { border-color: #ff0; transform: scale(1.15); }
  #clear-btn {
    background: #e74c3c; color: #fff; border: none; padding: 8px 16px;
    border-radius: 20px; cursor: pointer; font-size: 14px;
  }
  #status {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    color: #fff; background: rgba(0,0,0,0.6); padding: 8px 20px;
    border-radius: 20px; z-index: 10; font-size: 14px;
  }
</style>
</head>
<body>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<div id="status">⏳ جاري تحميل نموذج التعرف على اليد...</div>

<div id="ui">
  <div class="color-btn active" style="background:#ff3b30" data-color="#ff3b30"></div>
  <div class="color-btn" style="background:#34c759" data-color="#34c759"></div>
  <div class="color-btn" style="background:#007aff" data-color="#007aff"></div>
  <div class="color-btn" style="background:#ffcc00" data-color="#ffcc00"></div>
  <div class="color-btn" style="background:#af52de" data-color="#af52de"></div>
  <div class="color-btn" style="background:#ffffff" data-color="#ffffff"></div>
  <button id="clear-btn">مسح الكل</button>
</div>

<script type="module">
import { FilesetResolver, HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');

let handLandmarker = null;
let currentColor = '#ff3b30';
let isDrawing = false;
let lastX = null, lastY = null;

// ضبط حجم اللوحة
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.lineWidth = 6;
}
window.addEventListener('resize', resize);
resize();

// أزرار الألوان
document.querySelectorAll('.color-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentColor = btn.dataset.color;
  });
});

// مسح اللوحة
document.getElementById('clear-btn').addEventListener('click', () => {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
});

// تهيئة MediaPipe
async function init() {
  statusEl.textContent = '⏳ جاري تهيئة الكاميرا...';

  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
  );

  handLandmarker = await HandLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
      delegate: "GPU"
    },
    runningMode: "VIDEO",
    numHands: 1
  });

  statusEl.textContent = '⏳ جاري تشغيل الكاميرا...';

  const stream = await navigator.mediaDevices.getUserMedia({
    video: { width: 1280, height: 720, facingMode: "user" }
  });

  video.srcObject = stream;
  await video.play();

  statusEl.textContent = '✅ جاهز! ارفع إصبع السبابة للرسم';

  requestAnimationFrame(loop);
}

// حلقة الرسم الرئيسية
function loop() {
  if (video.readyState !== 4 || !handLandmarker) {
    requestAnimationFrame(loop);
    return;
  }

  const results = handLandmarker.detectForVideo(video, performance.now());

  // رسم فيديو الكاميرا كخلفية
  ctx.save();
  ctx.translate(canvas.width, 0);
  ctx.scale(-1, 1);
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  ctx.restore();

  if (results.landmarks && results.landmarks.length > 0) {
    const landmarks = results.landmarks[0];

    // نقطة طرف السبابة = 8
    const tip = landmarks[8];
    const x = (1 - tip.x) * canvas.width;
    const y = tip.y * canvas.height;

    // الكشف عن "إصبع السبابة مرفوع": طرف السبابة أعلى من المفصل الثاني
    const indexTip = landmarks[8];
    const indexPip = landmarks[6];
    const indexExtended = indexTip.y < indexPip.y;

    // الكشف عن الأصابع الأخرى مثنية (على الأقل الوسطى)
    const middleTip = landmarks[12];
    const middlePip = landmarks[10];
    const middleBent = middleTip.y > middlePip.y;

    const isDrawingGesture = indexExtended && middleBent;

    if (isDrawingGesture) {
      if (!isDrawing) {
        // بداية خط جديد
        isDrawing = true;
        lastX = x;
        lastY = y;
      } else {
        // استمرار الرسم
        ctx.beginPath();
        ctx.strokeStyle = currentColor;
        ctx.lineWidth = 6;
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(x, y);
        ctx.stroke();
        lastX = x;
        lastY = y;
      }
    } else {
      isDrawing = false;
      lastX = null;
      lastY = null;
    }
  } else {
    isDrawing = false;
    lastX = null;
    lastY = null;
  }

  requestAnimationFrame(loop);
}

init().catch(err => {
  statusEl.textContent = '❌ خطأ: ' + err.message;
  console.error(err);
});
</script>

</body>
</html>
